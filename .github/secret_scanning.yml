# Secret scanning exclusions.
#
# tests/fixtures/housing_act_1988_s21_clml.xml is a faithful capture of the
# public legislation.gov.uk CLML document for Housing Act 1988 s.21
# (http://www.legislation.gov.uk/ukpga/1988/50/section/21/data.xml, OGL v3).
# CLML labels effects and changes with ids of the form `key-` + 32 hex, in
# EffectId, ChangeId and /id/effect/ URIs. GitHub's Mailgun API key pattern
# matches that shape, so the capture trips push protection with about ten
# false positives. The same ids are served publicly by legislation.gov.uk and
# are not credentials.
#
# Excluded by exact path, so every other file, the other fixtures included,
# stays scanned.
paths-ignore:
  - "tests/fixtures/housing_act_1988_s21_clml.xml"
