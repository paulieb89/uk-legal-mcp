name: Release

on:
  release:
    types: [published]

jobs:
  test:
    name: Non-live tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: uv sync --frozen --group dev
      # No live-marked test runs here, so nothing should reach the network. The
      # dead proxy turns an accidental request into a failure instead of a
      # silent pass; it is a regression guard, not proof that egress is closed.
      - run: uv run pytest -m "not live" -q
        env:
          UV_FROZEN: "1"
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

