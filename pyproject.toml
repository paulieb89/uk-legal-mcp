[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-legal-mcp"
version = "0.1.0"
description = "UK legal research MCP server — case law, legislation, parliament, citations, HMRC"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "lxml>=5.2.0",
]

[project.scripts]
uk-legal-mcp = "src.gateway:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
