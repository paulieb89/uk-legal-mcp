[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-legal-mcp"
version = "0.4.4"
description = "UK legal research MCP server — case law, legislation, parliament, bills, votes, committees, citations, HMRC"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Paul Boucher" },
]
keywords = [
    "mcp",
    "legal",
    "uk-law",
    "case-law",
    "legislation",
    "parliament",
    "hansard",
    "hmrc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastmcp==3.2.4",
    "mcp==1.27.0",
    "httpx==0.28.1",
    "pydantic==2.13.0",
    "lxml==6.0.4",
    "curl-cffi>=0.15.0",
    "prometheus-client==0.24.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "tiktoken>=0.8.0"]

[project.urls]
Repository = "https://github.com/paulieb89/uk-legal-mcp"
Documentation = "https://github.com/paulieb89/uk-legal-mcp#readme"
"Bug Tracker" = "https://github.com/paulieb89/uk-legal-mcp/issues"
"Live Endpoint" = "https://uk-legal-mcp.fly.dev/mcp"

[project.scripts]
uk-legal-mcp = "src.gateway:main_stdio"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".build-venv/",
    ".mypy_cache/",
    ".pytest_cache/",
    "research/",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "tiktoken>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "live: hits live external APIs — excluded from offline CI (deselect with -m 'not live')",
]
